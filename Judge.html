<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ban Giám Khảo - Hệ Thống Bình Chọn 101</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'SFAlienEncountersSolid';
      src: url('/SFAlienEncountersSolid.ttf') format('truetype'),
           url('/fonts/SFAlienEncountersSolid.ttf') format('truetype');
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-weight: bold !important;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #0c1033 0%, #050716 100%);
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Card Container */
    .judge-card {
      width: 100%;
      max-width: 460px;
      background: rgba(10, 15, 45, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(112, 61, 255, 0.2);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card-header {
      text-align: center;
      position: relative;
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #d8b4fe;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Login Screen */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .input-field, .select-field {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus, .select-field:focus {
      border-color: #a855f7;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.5);
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .btn-submit:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.4);
    }

    .error-msg {
      color: #f87171;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      display: none;
      background: rgba(239, 68, 68, 0.15);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* Main Voting Screen */
    .judge-screen {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
    }

    .status-seat {
      font-weight: 800;
      color: #a855f7;
      font-size: 15px;
    }

    .status-room {
      color: #94a3b8;
      font-weight: 600;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      box-shadow: 0 0 8px #22c55e;
    }

    .mode-indicator {
      text-align: center;
      padding: 12px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .mode-indicator.locked {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .mode-indicator.normal {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .mode-indicator.versus {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.15) 0%, rgba(59, 130, 246, 0.15) 100%);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #f472b6;
    }

    /* 4 Voting Buttons Grid */
    .vote-buttons-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .vote-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .vote-btn {
      position: relative;
      border: none;
      border-radius: 18px;
      padding: 24px 12px;
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .vote-btn:active {
      transform: scale(0.96);
    }

    /* Disabled / Locked State */
    .vote-btn.is-disabled {
      opacity: 0.35;
      pointer-events: none;
      filter: grayscale(0.85);
      transform: none !important;
      box-shadow: none;
    }

    /* 1. Nút Chọn (Xanh lá) */
    .btn-chon {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      border: 2px solid #22c55e;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
    }

    /* 2. Nút Không chọn (Đỏ) */
    .btn-khong-chon {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      border: 2px solid #ef4444;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
    }

    /* 3. Nút Màu xanh (Xanh dương) */
    .btn-xanh {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border: 2px solid #3b82f6;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    /* 4. Nút Màu hồng (Hồng) */
    .btn-hong {
      background: linear-gradient(135deg, #db2777 0%, #be185d 100%);
      border: 2px solid #ec4899;
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
    }

    /* Trạng thái đã chọn (Active / Selected) */
    .vote-btn.is-selected {
      transform: scale(1.03);
      box-shadow: 0 0 35px #ffffff, 0 0 50px currentColor !important;
      border-color: #ffffff !important;
      animation: pulseActive 1.8s infinite alternate ease-in-out;
    }

    .vote-btn.is-selected::after {
      content: "✓ ĐÃ CHỌN";
      position: absolute;
      bottom: -10px;
      background: #ffffff;
      color: #0f172a;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 10px;
      border-radius: 9999px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    @keyframes pulseActive {
      0% { transform: scale(1.02); }
      100% { transform: scale(1.05); }
    }

    .vote-btn-icon {
      font-size: 26px;
    }

    .vote-btn-label {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* Notification Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="judge-card">
    <div class="card-header">
      <div class="card-badge">✨ Stage 101 Online</div>
      <h1 class="card-title">BAN GIÁM KHẢO</h1>
      <p class="card-subtitle">Hệ thống biểu quyết & bình chọn trực tiếp</p>
    </div>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div class="login-form" id="loginScreen">
      <div class="input-group">
        <label class="input-label" for="seatSelect">Vị trí ghế ngồi (Từ 1 - 101):</label>
        <select class="select-field" id="seatSelect">
          <option value="">-- Chọn vị trí của bạn --</option>
        </select>
      </div>

      <div class="input-group">
        <label class="input-label" for="roomInput">Mã phòng (6 chữ số):</label>
        <input type="text" class="input-field" id="roomInput" maxlength="6" inputmode="numeric" placeholder="VD: 101101" autocomplete="off" />
      </div>

      <div class="error-msg" id="loginError"></div>

      <button type="button" class="btn-submit" id="btnLogin">XÁC NHẬN VÀO PHÒNG</button>
    </div>

    <!-- MÀN HÌNH BÌNH CHỌN CHÍNH -->
    <div class="judge-screen" id="judgeScreen">
      <div class="status-bar">
        <div>Vị trí: <span class="status-seat" id="displaySeat">#--</span></div>
        <div>Phòng: <span class="status-room" id="displayRoom">------</span></div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span class="connection-dot" id="connDot"></span>
          <span style="font-size: 11px; color: #94a3b8;" id="connText">Online</span>
        </div>
      </div>

      <div class="mode-indicator locked" id="modeIndicator">
        🔒 Bình chọn đang khóa
      </div>

      <div class="vote-buttons-grid">
        <!-- Cặp 1: Chọn (Xanh lá) & Không chọn (Đỏ) -->
        <div class="vote-pair">
          <button type="button" class="vote-btn btn-chon is-disabled" id="btnChon" data-vote="CHON">
            <span class="vote-btn-icon">🟢</span>
            <span class="vote-btn-label">Chọn</span>
          </button>

          <button type="button" class="vote-btn btn-khong-chon is-disabled" id="btnKhongChon" data-vote="KHONG_CHON">
            <span class="vote-btn-icon">🔴</span>
            <span class="vote-btn-label">Không chọn</span>
          </button>
        </div>

        <!-- Cặp 2: Màu xanh (Xanh dương) & Màu hồng (Hồng) -->
        <div class="vote-pair">
          <button type="button" class="vote-btn btn-hong is-disabled" id="btnHong" data-vote="HONG">
            <span class="vote-btn-icon">💖</span>
            <span class="vote-btn-label">Màu hồng</span>
          </button>

          <button type="button" class="vote-btn btn-xanh is-disabled" id="btnXanh" data-vote="XANH">
            <span class="vote-btn-icon">🔷</span>
            <span class="vote-btn-label">Màu xanh</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Điền 101 vị trí vào dropdown
    const seatSelect = document.getElementById("seatSelect");
    for (let i = 1; i <= 101; i++) {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `Ghế #${i} (Vị trí ${i})`;
      seatSelect.appendChild(opt);
    }

    const loginScreen = document.getElementById("loginScreen");
    const judgeScreen = document.getElementById("judgeScreen");
    const roomInput = document.getElementById("roomInput");
    const btnLogin = document.getElementById("btnLogin");
    const loginError = document.getElementById("loginError");

    const displaySeat = document.getElementById("displaySeat");
    const displayRoom = document.getElementById("displayRoom");
    const modeIndicator = document.getElementById("modeIndicator");
    const connDot = document.getElementById("connDot");
    const connText = document.getElementById("connText");
    const toast = document.getElementById("toast");

    const btnChon = document.getElementById("btnChon");
    const btnKhongChon = document.getElementById("btnKhongChon");
    const btnXanh = document.getElementById("btnXanh");
    const btnHong = document.getElementById("btnHong");
    const allVoteButtons = [btnChon, btnKhongChon, btnXanh, btnHong];

    let currentSeatId = null;
    let currentRoomId = null;
    let currentVotingMode = "LOCKED";
    let selectedVote = null;
    let hasVoted = false;
    let lastHandledMode = null;
    let ws = null;

    const voteLabels = {
      CHON: "CHỌN (Xanh lá)",
      KHONG_CHON: "KHÔNG CHỌN (Đỏ)",
      XANH: "MÀU XANH (Xanh dương)",
      HONG: "MÀU HỒNG (Hồng)"
    };

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function showError(msg) {
      loginError.textContent = msg;
      loginError.style.display = "block";
    }

    function hideError() {
      loginError.style.display = "none";
    }

    // Cập nhật giao diện theo chế độ bình chọn
    function updateVotingUI(mode) {
      // Nếu đổi chế độ mới (ví dụ từ LOCKED sang NORMAL / VERSUS), cho phép bình chọn đợt mới
      if (lastHandledMode !== mode) {
        if (mode !== "LOCKED" && lastHandledMode === "LOCKED") {
          // Vòng mới mở lại
          hasVoted = false;
          selectedVote = null;
        }
        lastHandledMode = mode;
      }

      currentVotingMode = mode;

      if (hasVoted && selectedVote) {
        // Đã chọn -> Khóa toàn bộ nút và thông báo không thể chọn lại
        modeIndicator.className = "mode-indicator normal";
        modeIndicator.innerHTML = `✅ ĐÃ BÌNH CHỌN: <span style="color:#ffd269">${voteLabels[selectedVote] || selectedVote}</span><br><small style="font-size:12px; opacity:0.85;">(Đã lưu vào hệ thống - Không thể chọn lại)</small>`;
        
        allVoteButtons.forEach(btn => {
          if (btn.dataset.vote === selectedVote) {
            btn.classList.remove("is-disabled");
            btn.classList.add("is-selected");
          } else {
            btn.classList.add("is-disabled");
            btn.classList.remove("is-selected");
          }
        });
        return;
      }

      if (mode === "NORMAL") {
        modeIndicator.className = "mode-indicator normal";
        modeIndicator.innerHTML = "🟢 BÌNH CHỌN THƯỜNG (Chọn / Không chọn)";
        // Mở nút Chọn & Không chọn
        btnChon.classList.remove("is-disabled");
        btnKhongChon.classList.remove("is-disabled");
        // Khóa nút Xanh & Hồng
        btnXanh.classList.add("is-disabled");
        btnHong.classList.add("is-disabled");
      } else if (mode === "VERSUS") {
        modeIndicator.className = "mode-indicator versus";
        modeIndicator.innerHTML = "⚡ BÌNH CHỌN ĐỐI ĐẦU (Màu xanh / Màu hồng)";
        // Mở nút Xanh & Hồng
        btnXanh.classList.remove("is-disabled");
        btnHong.classList.remove("is-disabled");
        // Khóa nút Chọn & Không chọn
        btnChon.classList.add("is-disabled");
        btnKhongChon.classList.add("is-disabled");
      } else {
        // LOCKED
        modeIndicator.className = "mode-indicator locked";
        modeIndicator.innerHTML = "🔒 Bình chọn đang khóa";
        allVoteButtons.forEach(btn => btn.classList.add("is-disabled"));
      }

      // Xóa đánh dấu nếu chưa vote
      allVoteButtons.forEach(btn => {
        btn.classList.remove("is-selected");
      });
    }

    // Xử lý gửi bình chọn (Chỉ được chọn 1 lần duy nhất)
    function castVote(voteType) {
      if (hasVoted) {
        showToast("⚠️ Bạn đã gửi bình chọn rồi, không thể chọn lại!");
        return;
      }

      if (currentVotingMode === "LOCKED") {
        showToast("⚠️ Bình chọn đang khóa!");
        return;
      }

      if (currentVotingMode === "NORMAL" && (voteType !== "CHON" && voteType !== "KHONG_CHON")) {
        return;
      }

      if (currentVotingMode === "VERSUS" && (voteType !== "XANH" && voteType !== "HONG")) {
        return;
      }

      // Ghi nhận đã chọn và khóa ngay lập tức
      hasVoted = true;
      selectedVote = voteType;

      // Rung phản hồi trên mobile
      if (navigator.vibrate) {
        navigator.vibrate(60);
      }

      // Cập nhật UI khóa ngay lập tức
      updateVotingUI(currentVotingMode);

      showToast(`✅ Đã gửi: ${voteLabels[voteType] || voteType}`);

      // Gửi qua WebSocket
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: "CAST_VOTE",
          roomId: currentRoomId,
          seatId: currentSeatId,
          vote: voteType
        }));
      }

      // Backup qua REST API
      fetch("/api/voting/vote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          roomId: currentRoomId,
          seatId: currentSeatId,
          vote: voteType
        })
      }).catch(err => console.warn("[Judge] Lỗi gửi vote REST:", err));
    }

    allVoteButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        castVote(btn.dataset.vote);
      });
    });

    // Kết nối WebSocket thời gian thực
    function connectWebSocket() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${location.host}/ws`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        connDot.style.background = "#22c55e";
        connDot.style.boxShadow = "0 0 8px #22c55e";
        connText.textContent = "Online";
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === "STATE_SYNC") {
            if (msg.state && msg.state.voting) {
              if (msg.state.voting.votes && currentSeatId && msg.state.voting.votes[currentSeatId]) {
                selectedVote = msg.state.voting.votes[currentSeatId];
                hasVoted = true;
              }
              updateVotingUI(msg.state.voting.mode || "LOCKED");
            }
          } else if (msg.type === "VOTING_MODE_CHANGED") {
            if (msg.voting && msg.voting.votes && currentSeatId && msg.voting.votes[currentSeatId]) {
              selectedVote = msg.voting.votes[currentSeatId];
              hasVoted = true;
            } else if (msg.mode !== "LOCKED") {
              hasVoted = false;
              selectedVote = null;
            }
            updateVotingUI(msg.mode);
            showToast(msg.mode === "NORMAL" ? "🟢 Đã mở bình chọn Thường" : (msg.mode === "VERSUS" ? "⚡ Đã mở bình chọn Đối đầu" : "🔒 Đã khóa bình chọn"));
          } else if (msg.type === "ROOM_UPDATED") {
            if (msg.roomCode !== currentRoomId) {
              showToast("⚠️ Mã phòng đã thay đổi trên hệ thống!");
            } else {
              hasVoted = false;
              selectedVote = null;
            }
          }
        } catch (e) {
          console.error("[Judge WS Error]", e);
        }
      };

      ws.onclose = () => {
        connDot.style.background = "#ef4444";
        connDot.style.boxShadow = "0 0 8px #ef4444";
        connText.textContent = "Mất kết nối...";
        setTimeout(connectWebSocket, 2000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    // Đăng nhập vào phòng
    async function loginJudge(seatId, roomId) {
      hideError();
      btnLogin.disabled = true;
      btnLogin.textContent = "Đang kiểm tra...";

      try {
        const res = await fetch("/api/room/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ seatId, roomId })
        });
        const data = await res.json();

        if (!data.success) {
          showError(data.error || "Mã phòng không đúng!");
          btnLogin.disabled = false;
          btnLogin.textContent = "XÁC NHẬN VÀO PHÒNG";
          return false;
        }

        // Thành công -> Chuyển sang màn hình chính
        currentSeatId = Number(seatId);
        currentRoomId = roomId.toString();
        selectedVote = data.currentVote || null;

        displaySeat.textContent = `#${currentSeatId}`;
        displayRoom.textContent = currentRoomId;

        // Cập nhật tham số URL theo đúng yêu cầu: ?id=Vịtrí&roomid=Mãphòng
        const newUrl = `${window.location.pathname}?id=${currentSeatId}&roomid=${currentRoomId}`;
        window.history.replaceState({}, "", newUrl);

        loginScreen.style.display = "none";
        judgeScreen.style.display = "flex";

        updateVotingUI(data.votingMode || "LOCKED");
        connectWebSocket();
        return true;
      } catch (err) {
        showError("Lỗi kết nối máy chủ, vui lòng thử lại!");
        btnLogin.disabled = false;
        btnLogin.textContent = "XÁC NHẬN VÀO PHÒNG";
        return false;
      }
    }

    btnLogin.addEventListener("click", () => {
      const seat = seatSelect.value;
      const room = roomInput.value.trim();

      if (!seat) {
        showError("Vui lòng chọn vị trí của bạn (Từ 1 - 101)!");
        return;
      }

      if (!room || room.length < 6) {
        showError("Vui lòng nhập đủ mã phòng 6 chữ số!");
        return;
      }

      loginJudge(seat, room);
    });

    // Tự động nhận diện tham số URL khi mở link trực tiếp (?id=...&roomid=...)
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const urlId = params.get("id");
      const urlRoom = params.get("roomid");

      if (urlId) {
        seatSelect.value = urlId;
      }
      if (urlRoom) {
        roomInput.value = urlRoom;
      }

      if (urlId && urlRoom && urlRoom.length === 6) {
        loginJudge(urlId, urlRoom);
      }
    });
  </script>
</body>
</html>

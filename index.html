<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TÔI LÀ NGƯỜI CHIẾN THẮNG - Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <script disable-devtool-auto src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>
  <style>
    @font-face {
      font-family: 'SFAlienEncountersSolid';
      src: url('/SFAlienEncountersSolid.ttf') format('truetype'),
           url('/fonts/SFAlienEncountersSolid.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-weight: bold !important;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02072a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Scene tỷ lệ 16:9 chuẩn 1920x1080 (Tự động scale khít mọi kích thước màn hình theo mặc định) */
    .scene-container {
      position: relative;
      width: 1920px;
      height: 1080px;
      min-width: 1920px;
      min-height: 1080px;
      max-width: 1920px;
      max-height: 1080px;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 43%, rgba(27, 31, 105, 0.72) 0%, rgba(7, 13, 59, 0.92) 46%, #02072a 100%);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
      transform-origin: center center;
      flex-shrink: 0;
    }

    /* Ánh sáng nền sân khấu */
    .scene-container::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 10% 57%, rgba(67, 92, 255, 0.15), transparent 30%),
        radial-gradient(ellipse at 90% 57%, rgba(115, 65, 255, 0.15), transparent 30%),
        linear-gradient(180deg, rgba(34, 43, 115, 0.18), transparent 30%);
      pointer-events: none;
      z-index: 1;
    }

    /* Dàn đèn chiếu phía trên */
    .top-lights {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .top-lights span {
      position: absolute;
      top: -16px;
      left: 50%;
      width: 3px;
      height: 130px;
      transform-origin: bottom center;
      border-radius: 2px;
      background: linear-gradient(#ff39dc, #455cff);
      box-shadow: 0 0 10px rgba(255, 65, 223, 0.85);
      transition: opacity 0.5s ease;
    }
    .top-lights span:nth-child(1) { transform: translateX(-50%) rotate(-31deg); }
    .top-lights span:nth-child(2) { transform: translateX(-50%) rotate(-22deg); }
    .top-lights span:nth-child(3) { transform: translateX(-50%) rotate(-13deg); }
    .top-lights span:nth-child(4) { transform: translateX(-50%) rotate(-4deg); }
    .top-lights span:nth-child(5) {
      transform: translateX(-50%) rotate(6deg);
      background: linear-gradient(#4c5dff, #4c68ff);
      box-shadow: 0 0 10px #4260ff;
    }
    .top-lights span:nth-child(6) {
      transform: translateX(-50%) rotate(15deg);
      background: linear-gradient(#405aff, #ea42ed);
    }
    .top-lights span:nth-child(7) {
      transform: translateX(-50%) rotate(24deg);
      background: linear-gradient(#405aff, #ea42ed);
    }
    .top-lights span:nth-child(8) {
      transform: translateX(-50%) rotate(32deg);
      background: linear-gradient(#405aff, #ea42ed);
    }

    /* Khung viền LED chữ V bao quanh khán đài */
    .frame {
      position: absolute;
      z-index: 3;
      left: 17px;
      top: 153px;
      width: 1886px;
      height: 647px;
      border: 7px solid #703dff;
      border-radius: 30px;
      clip-path: polygon(
        0 0,
        25.7% 0,
        31.7% 19.6%,
        35% 19.6%,
        37% 18.8%,
        50% 18.8%,
        63% 18.8%,
        65% 19.6%,
        68.3% 19.6%,
        74.3% 0,
        100% 0,
        92.2% 100%,
        68.0% 100%,
        58.0% 51.0%,
        42.0% 51.0%,
        32.0% 100%,
        7.8% 100%
      );
      filter: drop-shadow(0 0 8px #6127ff) drop-shadow(0 0 20px rgba(105, 39, 255, 0.8));
      pointer-events: none;
      transition: all 0.4s ease;
    }
    .frame::after {
      content: "";
      position: absolute;
      inset: 2px;
      border: 2px solid rgba(196, 67, 255, 0.58);
      clip-path: inherit;
    }

    /* Sàn trung tâm */
    .floor {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 670px;
      width: 700px;
      height: 410px;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .floor .line {
      position: absolute;
      height: 4px;
      background: linear-gradient(90deg, transparent, #4458ff, #ed49ef);
      box-shadow: 0 0 10px rgba(87, 79, 255, 0.85);
      transform-origin: left center;
    }
    .floor .l1 { left: 150px; top: 30px; width: 390px; transform: rotate(153deg); }
    .floor .l2 { left: 75px; top: 80px; width: 340px; transform: rotate(160deg); }
    .floor .l3 { left: 500px; top: 30px; width: 390px; transform: rotate(27deg); }
    .floor .l4 { left: 595px; top: 80px; width: 340px; transform: rotate(20deg); }
    .floor .l5 { left: 150px; top: 0; width: 270px; transform: rotate(170deg); }
    .floor .l6 { left: 550px; top: 0; width: 270px; transform: rotate(10deg); }

    /* Ánh sáng mờ hai cánh */
    .glow {
      position: absolute;
      z-index: 1;
      width: 520px;
      height: 700px;
      top: 120px;
      filter: blur(50px);
      opacity: 0.18;
      pointer-events: none;
    }
    .glow.left {
      left: -250px;
      background: linear-gradient(90deg, transparent, #4b6cff, transparent);
      transform: rotate(22deg);
    }
    .glow.right {
      right: -250px;
      background: linear-gradient(90deg, transparent, #873eff, transparent);
      transform: rotate(-22deg);
    }

    /* Container chứa 101 ô */
    #audience {
      position: absolute;
      inset: 0;
      z-index: 8;
    }

    /* Từng ô trong 101 ô (Không có hình người, chỉ có ô sáng sân khấu) */
    .seat {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 64px;
      height: 94px;
      transform: translate(-50%, -50%);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: linear-gradient(180deg, #ffffff 0%, #f5f6ff 72%, #dadbed 100%);
      box-shadow:
        0 0 8px rgba(255, 255, 255, 0.8),
        inset 0 0 14px rgba(130, 140, 240, 0.25);
      overflow: hidden;
      transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease, transform 0.15s ease;
      will-change: background, box-shadow, border-color;
    }

    /* Trạng thái tắt / màu đen */
    .seat.is-black {
      background: linear-gradient(180deg, #050818 0%, #02040d 100%) !important;
      border-color: rgba(40, 50, 100, 0.4) !important;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.95), 0 0 2px rgba(10, 15, 40, 0.4) !important;
    }

    /* Trạng thái bật sáng rực rỡ khi sóng đèn đi qua */
    .seat.is-active-lit {
      background: linear-gradient(180deg, #ffffff 0%, #fff7d6 45%, #ffd269 100%) !important;
      border-color: #ffffff !important;
      box-shadow:
        0 0 24px rgba(255, 230, 130, 1),
        0 0 45px rgba(255, 180, 50, 0.8),
        inset 0 0 16px rgba(255, 255, 255, 0.95) !important;
      transform: translate(-50%, -50%) scale(1.05);
      z-index: 10;
    }

    /* Trạng thái sáng trắng đồng loạt */
    .seat.is-white {
      background: linear-gradient(180deg, #ffffff 0%, #f6f8ff 70%, #dfe4f7 100%) !important;
      border-color: #ffffff !important;
      box-shadow:
        0 0 16px rgba(255, 255, 255, 0.95),
        0 0 32px rgba(180, 200, 255, 0.6),
        inset 0 0 12px rgba(255, 255, 255, 0.8) !important;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Trạng thái Chọn: Màu xanh lá */
    .seat.is-green-lit {
      background: linear-gradient(180deg, #ffffff 0%, #bbf7d0 35%, #22c55e 100%) !important;
      border-color: #4ade80 !important;
      box-shadow:
        0 0 25px rgba(34, 197, 94, 1),
        0 0 50px rgba(34, 197, 94, 0.8),
        inset 0 0 16px rgba(255, 255, 255, 0.95) !important;
      transform: translate(-50%, -50%) scale(1.05);
      z-index: 12;
    }

    /* Trạng thái Đối đầu: Màu hồng như trong ảnh tham khảo */
    .seat.is-pink-lit {
      background: linear-gradient(180deg, #ffffff 0%, #ff66cc 20%, #ff007f 60%, #c20060 100%) !important;
      border-color: #ffa6e9 !important;
      box-shadow:
        0 0 25px rgba(255, 0, 127, 1),
        0 0 50px rgba(255, 0, 127, 0.85),
        inset 0 0 16px rgba(255, 255, 255, 0.95) !important;
      transform: translate(-50%, -50%) scale(1.05);
      z-index: 12;
    }

    /* Trạng thái Đối đầu: Màu xanh như trong ảnh tham khảo */
    .seat.is-blue-lit {
      background: linear-gradient(180deg, #ffffff 0%, #7dd3fc 20%, #00d2ff 60%, #0284c7 100%) !important;
      border-color: #a5f3fc !important;
      box-shadow:
        0 0 25px rgba(0, 210, 255, 1),
        0 0 50px rgba(0, 210, 255, 0.85),
        inset 0 0 16px rgba(255, 255, 255, 0.95) !important;
      transform: translate(-50%, -50%) scale(1.05);
      z-index: 12;
    }

    /* VỊ TRÍ TRUNG TÂM HIỂN THỊ TỈ SỐ VÀ SỐ ĐIỂM (Cao hơn hàng 1 một chút) */
    /* Hàng 1 có y = 186px -> Điểm/Tỉ số đặt ở y = 168px */
    .center-stage-score {
      position: absolute;
      left: 960px;
      top: 168px;
      transform: translate(-50%, -50%);
      z-index: 25;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-family: 'SFAlienEncountersSolid', 'Orbitron', 'Chakra Petch', monospace, sans-serif;
      text-shadow: 0 0 25px currentColor;
      user-select: none;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    /* Số điểm (Hiện kết quả thường): Font to hơn, đặt cao hơn hàng đầu */
    .score-single-number {
      font-size: 118px;
      color: #22c55e;
      text-shadow: 0 0 25px rgba(34, 197, 94, 0.95), 0 0 55px rgba(34, 197, 94, 0.8), 0 0 90px rgba(34, 197, 94, 0.5);
      letter-spacing: 4px;
      font-weight: 900;
    }

    /* Tỉ số đối đầu / tỉ số khán giả / tham khảo: Font to hơn, khoảng cách 2 số xa ra, không có dấu : */
    .score-pair {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 220px;
      font-size: 112px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .score-pink {
      color: #ff007f;
      text-shadow: 0 0 25px #ff007f, 0 0 50px rgba(255, 0, 127, 0.95), 0 0 85px rgba(255, 0, 127, 0.65);
      min-width: 140px;
      text-align: right;
    }

    .score-blue {
      color: #00d2ff;
      text-shadow: 0 0 25px #00d2ff, 0 0 50px rgba(0, 210, 255, 0.95), 0 0 85px rgba(0, 210, 255, 0.65);
      min-width: 140px;
      text-align: left;
    }

    /* Màn hình cảnh báo khi URL thiếu ?roomid */
    .no-room-warning {
      position: fixed;
      inset: 0;
      background: rgba(2, 7, 42, 0.97);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
    }
    .no-room-card {
      background: #0d143a;
      border: 2px solid #ef4444;
      box-shadow: 0 0 45px rgba(239, 68, 68, 0.4), inset 0 0 25px rgba(239, 68, 68, 0.2);
      border-radius: 18px;
      padding: 36px 44px;
      text-align: center;
      max-width: 620px;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .no-room-icon { font-size: 52px; margin-bottom: 12px; }
    .no-room-title { font-size: 22px; font-weight: 900; color: #f87171; letter-spacing: 2px; margin-bottom: 10px; }
    .no-room-desc { font-size: 20px; font-weight: 900 !important; color: #f1f5f9; margin-bottom: 12px; }
    .no-room-desc .highlight { color: #facc15; font-weight: 900 !important; background: rgba(250, 204, 21, 0.15); padding: 3px 10px; border-radius: 6px; border: 1px solid rgba(250, 204, 21, 0.4); }
    .no-room-sub { font-size: 15px; font-weight: 800 !important; color: #94a3b8; margin-top: 8px; }
    .no-room-sub code { background: #050b24; padding: 4px 10px; border-radius: 6px; color: #38bdf8; font-family: monospace; font-weight: 900 !important; font-size: 15px; }
  </style>
</head>

<body>
  <!-- Cảnh báo khi URL thiếu ?roomid (Không dùng alert/prompt/confirm) -->
  <div id="noRoomWarning" class="no-room-warning">
    <div class="no-room-card">
      <div class="no-room-icon">⚠️</div>
      <div class="no-room-title">THIẾU THAM SỐ PHÒNG</div>
      <div class="no-room-desc">Vui lòng nhập <span class="highlight">?roomid=Mã phòng</span> lên URL</div>
      <div class="no-room-sub">Ví dụ: <code>index.html?roomid=123456</code></div>
    </div>
  </div>

  <div class="scene-container" id="sceneContainer">
    <!-- Ánh sáng mờ 2 cánh -->
    <div class="glow left"></div>
    <div class="glow right"></div>

    <!-- Dàn đèn chiếu phía trên -->
    <div class="top-lights">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <!-- Khung viền LED chữ V -->
    <div class="frame" id="stageFrame"></div>

    <!-- Container chứa đúng 101 ô -->
    <div id="audience"></div>

    <!-- Tỉ Số & Điểm Trung Tâm Hàng 2 (x=960px, y=236px) -->
    <div class="center-stage-score" id="centerStageScore"></div>

    <!-- Sàn trung tâm -->
    <div class="floor">
      <i class="line l1"></i><i class="line l2"></i>
      <i class="line l3"></i><i class="line l4"></i>
      <i class="line l5"></i><i class="line l6"></i>
    </div>
  </div>

  <!-- Audio Elements -->
  <audio id="audioOpening" src="/audio/Opening.mp3" preload="auto"></audio>
  <audio id="audioContestant" src="/audio/Contestant.mp3" preload="auto"></audio>
  <audio id="audioJudgeVote" src="/audio/Judge_Vote.mp3" preload="auto"></audio>
  <audio id="audioResult" src="/audio/Result.mp3" preload="auto"></audio>

  <script>
    // --- KHỞI TẠO TỌA ĐỘ VÀ DOM CHO ĐÚNG 101 Ô ---
    const audience = document.getElementById("audience");
    const centerStageScore = document.getElementById("centerStageScore");

    const audioElements = {
      1: document.getElementById("audioOpening"),
      2: document.getElementById("audioContestant"),
      3: document.getElementById("audioJudgeVote"),
      4: document.getElementById("audioResult")
    };

    // Kiểm tra nếu đang chạy trong chế độ mute của Controller (truyền ?mute=1)
    const urlParams = new URLSearchParams(window.location.search);
    const isMuted = urlParams.get("mute") === "1";
    const rawRoomId = urlParams.get("roomid") || urlParams.get("roomId");
    const hasRoomId = rawRoomId !== null && rawRoomId.trim().length > 0;
    const currentRoomId = hasRoomId ? rawRoomId.trim() : null;

    if (!hasRoomId) {
      const warningEl = document.getElementById("noRoomWarning");
      if (warningEl) warningEl.style.display = "flex";
    }

    // Cơ chế mở khóa Audio tự động ngay khi tương tác trang
    let audioUnlocked = false;
    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      Object.values(audioElements).forEach(audio => {
        if (audio) {
          const prevMuted = audio.muted;
          audio.muted = true;
          audio.play().then(() => {
            audio.pause();
            audio.currentTime = 0;
            audio.muted = prevMuted;
          }).catch(() => {
            audio.muted = prevMuted;
          });
        }
      });
    }

    window.addEventListener("click", unlockAudio, { passive: true });
    window.addEventListener("touchstart", unlockAudio, { passive: true });
    window.addEventListener("keydown", unlockAudio, { passive: true });
    window.addEventListener("pointerdown", unlockAudio, { passive: true });

    // Định nghĩa 10 hàng theo tọa độ ảnh tham chiếu 1920x1080
    // Quy tắc đánh số: Vị trí trung tâm ở hàng 6 là vị trí 101; các ô còn lại là 1 - 100 (từ trái qua phải, từ trên xuống dưới)
    const rows = [
      // Hàng 1: 5 + 5 = 10 ô (ID 1 -> 10)
      { rowIndex: 0, y: 186, xs: [194, 277.5, 361, 444.5, 528], right: [1399, 1484, 1576, 1668, 1766] },
      // Hàng 2: 5 + 5 = 10 ô (ID 11 -> 20)
      { rowIndex: 1, y: 236, xs: [207, 301, 387, 485, 566], right: [1352, 1440, 1534, 1628, 1719] },
      // Hàng 3: 5 + 5 = 10 ô (ID 21 -> 30)
      { rowIndex: 2, y: 288, xs: [233, 333, 423, 517, 604], right: [1310, 1407, 1508, 1602, 1695] },
      // Hàng 4: 7 + 7 = 14 ô (ID 31 -> 44)
      { rowIndex: 3, y: 350, xs: [257, 363, 458, 551, 643, 791, 888], right: [1039, 1124, 1288, 1383, 1486, 1576, 1673] },
      // Hàng 5: 8 + 8 = 16 ô (ID 45 -> 60)
      { rowIndex: 4, y: 404, xs: [279, 386, 483, 579, 671, 759, 839, 921], right: [1007, 1104, 1196, 1285, 1374, 1461, 1545, 1649] },
      // Hàng 6: 6 bên trái (ID 61 -> 66) + 1 trung tâm (ID 101) + 6 bên phải (ID 67 -> 72)
      { rowIndex: 5, y: 466, xs: [311, 423, 530, 625, 727, 824], center: 972, right: [1109, 1220, 1323, 1418, 1518, 1621] },
      // Hàng 7: 5 + 5 = 10 ô (ID 73 -> 82)
      { rowIndex: 6, y: 536, xs: [342, 455, 570, 658, 774], right: [1163, 1274, 1375, 1484, 1591] },
      // Hàng 8: 4 + 4 = 8 ô (ID 83 -> 90)
      { rowIndex: 7, y: 610, xs: [373, 492, 608, 717], right: [1238, 1352, 1454, 1565] },
      // Hàng 9: 3 + 3 = 6 ô (ID 91 -> 96)
      { rowIndex: 8, y: 700, xs: [406, 531, 657], right: [1293, 1417, 1540] },
      // Hàng 10: 2 + 2 = 4 ô (ID 97 -> 100)
      { rowIndex: 9, y: 785, xs: [442, 577], right: [1367, 1504] }
    ];

    const seats = [];
    const seatsById = {};
    const STAGE_CENTER_X = 960;
    const STAGE_CENTER_Y = 466;

    function createSeatElement(id, x, y, rowIndex, side) {
      const el = document.createElement("div");
      el.className = "seat";
      el.dataset.id = id;
      el.style.setProperty("--x", `${x}px`);
      el.style.setProperty("--y", `${y}px`);
      audience.appendChild(el);

      const dx = Math.abs(x - STAGE_CENTER_X);
      const dy = Math.abs(y - STAGE_CENTER_Y);
      const diagDist = Math.sqrt(dx * dx + (dy * 1.5) * (dy * 1.5));
      // Phân chia dải cột chéo từ tâm ra 2 bên (0: gần tâm nhất, 7: ngoài cùng) để mỗi bên sáng chuẩn xác 2 hàng
      const diagBand = Math.min(7, Math.max(0, Math.floor((dx - 20) / 95)));

      const seatObj = {
        id,
        el,
        x,
        y,
        rowIndex,
        dx,
        dy,
        diagDist,
        diagBand,
        side
      };
      seats.push(seatObj);
      seatsById[id] = seatObj;
    }

    let regularCounter = 1;
    rows.forEach(row => {
      // Nhóm bên trái theo thứ tự X tăng dần
      const sortedLeft = [...row.xs].sort((a, b) => a - b);
      sortedLeft.forEach(x => {
        const id = regularCounter++;
        createSeatElement(id, x, row.y, row.rowIndex, "left");
      });

      // Ô trung tâm ở hàng 6: luôn là vị trí 101
      if (row.center !== undefined) {
        createSeatElement(101, row.center, row.y, row.rowIndex, "center");
      }

      // Nhóm bên phải theo thứ tự X tăng dần
      const sortedRight = [...row.right].sort((a, b) => a - b);
      sortedRight.forEach(x => {
        const id = regularCounter++;
        createSeatElement(id, x, row.y, row.rowIndex, "right");
      });
    });

    // Sắp xếp danh sách seats theo đúng thứ tự ID 1 -> 101 để hiện kết quả tuần tự
    seats.sort((a, b) => a.id - b.id);

    console.log(`Đã khởi tạo thành công ${seats.length} ô khán giả (ID từ 1 đến 101).`);

    // --- HỆ THỐNG ÂM THANH SÂN KHẤU (CHỈ 4 FILE ĐÃ ĐỊNH NGHĨA) ---
    function playAudio(effectNum, explicitStartTime = 0) {
      if (isMuted) return;
      stopAllAudio();
      const audioEl = audioElements[effectNum];

      if (audioEl) {
        const startTime = Math.max(0, explicitStartTime);
        try {
          audioEl.currentTime = startTime;
        } catch (e) {}
        const playPromise = audioEl.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.warn(`[Audio] Trình duyệt chưa cho phép tự động phát âm thanh (${audioEl.src}):`, err);
          });
        }
      }
    }

    function stopAllAudio() {
      Object.values(audioElements).forEach(audio => {
        if (audio) {
          audio.pause();
          try {
            audio.currentTime = 0;
          } catch (e) {}
        }
      });
    }

    // --- ĐỒNG BỘ THỜI GIAN CHUẨN TOÀN CẦU (NTP CLOCK SYNC) ---
    let serverTimeOffset = 0;
    let lastPingLatency = 0;
    let onlineClientsCount = 1;

    function getServerNow() {
      return Date.now() + serverTimeOffset;
    }

    function syncServerClock(wsInstance) {
      if (wsInstance && wsInstance.readyState === WebSocket.OPEN) {
        const pingTime = Date.now();
        wsInstance.send(JSON.stringify({ type: "TIME_SYNC", clientPingTime: pingTime }));
      }
    }

    // --- ANIMATION ENGINE & STAGE DISPLAY ---
    let currentAnimationId = null;
    let currentEffectState = { effect: null, duration: 0, loopDuration: 0, serverStartTime: 0 };
    let referenceSwapInterval = null;
    let sequentialRevealTimer = null;

    function resetAllSeats(mode = "white") {
      if (currentAnimationId) {
        cancelAnimationFrame(currentAnimationId);
        currentAnimationId = null;
      }
      if (referenceSwapInterval) {
        clearInterval(referenceSwapInterval);
        referenceSwapInterval = null;
      }
      if (sequentialRevealTimer) {
        clearInterval(sequentialRevealTimer);
        sequentialRevealTimer = null;
      }

      centerStageScore.style.display = "none";
      centerStageScore.innerHTML = "";

      seats.forEach(s => {
        s.el.className = "seat";
        if (mode === "white") {
          s.el.classList.add("is-white");
        } else if (mode === "black") {
          s.el.classList.add("is-black");
        }
      });
    }

    // Hiệu ứng 1 (26s) & Hiệu ứng 2 (40s): Sóng chéo lan tỏa từ tâm ra 2 bên (Mỗi bên chỉ có 2 hàng sáng đèn)
    function runDiagonalSpreadEffect(effectNum, totalDuration, explicitServerStartTime = null) {
      resetAllSeats("black");
      const startTimestamp = explicitServerStartTime || getServerNow();
      currentEffectState = { effect: effectNum, duration: totalDuration, serverStartTime: startTimestamp };

      const wavePeriod = effectNum === 1 ? 2.6 : 3.2;

      function animate() {
        const now = getServerNow();
        const elapsed = (now - startTimestamp) / 1000;

        if (elapsed >= totalDuration) {
          seats.forEach(s => {
            s.el.className = "seat is-white";
          });
          currentAnimationId = null;
          return;
        }

        if (elapsed < 0) {
          currentAnimationId = requestAnimationFrame(animate);
          return;
        }

        const cycleProgress = (elapsed % wavePeriod) / wavePeriod;
        // Mỗi bên có chính xác 2 hàng sáng đèn di chuyển tuần hoàn từ tâm ra ngoài
        const band1 = Math.floor(cycleProgress * 8) % 8;
        const band2 = (band1 + 1) % 8;

        seats.forEach(s => {
          if (s.id === 101) {
            if (band1 === 0 || band2 === 0) {
              s.el.className = "seat is-active-lit";
            } else {
              s.el.className = "seat is-black";
            }
          } else if (s.diagBand === band1 || s.diagBand === band2) {
            s.el.className = "seat is-active-lit";
          } else {
            s.el.className = "seat is-black";
          }
        });

        currentAnimationId = requestAnimationFrame(animate);
      }

      currentAnimationId = requestAnimationFrame(animate);
    }

    // Hiệu ứng 3 (13s, loop 1.0s) & Hiệu ứng 4 (7s, loop 1.0s): 2 hàng ô sáng ngang di chuyển từ trên xuống dưới
    function runHorizontalScanEffect(effectNum, totalDuration, loopDuration, explicitServerStartTime = null, onCompleteCallback = null) {
      resetAllSeats("black");
      const startTimestamp = explicitServerStartTime || getServerNow();
      currentEffectState = { effect: effectNum, duration: totalDuration, loopDuration, serverStartTime: startTimestamp };

      const totalLoops = Math.round(totalDuration / loopDuration);

      function animate() {
        const now = getServerNow();
        const elapsed = (now - startTimestamp) / 1000;

        if (elapsed >= totalDuration) {
          seats.forEach(s => {
            s.el.className = "seat is-white";
          });
          currentAnimationId = null;
          if (onCompleteCallback) onCompleteCallback();
          return;
        }

        if (elapsed < 0) {
          currentAnimationId = requestAnimationFrame(animate);
          return;
        }

        const currentLoopNum = Math.min(totalLoops, Math.floor(elapsed / loopDuration) + 1);
        const loopElapsed = elapsed % loopDuration;
        const progress = loopElapsed / loopDuration;

        // 2 hàng ô liền kề nhau và cặp đầu-cuối sáng đèn (trong 10 hàng: rowIndex 0 -> 9)
        const activeRow1 = Math.floor(progress * 10) % 10;
        const activeRow2 = (activeRow1 + 1) % 10;

        seats.forEach(s => {
          if (s.rowIndex === activeRow1 || s.rowIndex === activeRow2) {
            s.el.className = "seat is-active-lit";
          } else {
            s.el.className = "seat is-black";
          }
        });

        currentAnimationId = requestAnimationFrame(animate);
      }

      currentAnimationId = requestAnimationFrame(animate);
    }

    // --- HIỂN THỊ KẾT QUẢ BÌNH CHỌN & TỈ SỐ TRÊN SÂN KHẤU (INDEX.HTML) ---

    // 1. Hiện kết quả (Thường):
    // Những ô có vị trí tương ứng với Chọn sẽ có màu xanh lá, còn lại là màu đen.
    // Xuất hiện từ từ (từ trái qua phải, từ trên xuống dưới - ô 1 đến 101), không phải tất cả cùng lúc.
    // Điểm số đặt ở trung tâm hàng 2 (font SFAlienEncountersSolid, màu xanh lá) và nhảy số theo tiến trình.
    function showNormalResult(votes = {}) {
      resetAllSeats("black");

      centerStageScore.style.display = "flex";
      centerStageScore.innerHTML = `<div class="score-single-number" id="liveScoreCounter">0</div>`;
      const liveScoreCounter = document.getElementById("liveScoreCounter");

      let currentSeatIndex = 0;
      let runningScore = 0;

      sequentialRevealTimer = setInterval(() => {
        if (currentSeatIndex >= seats.length) {
          clearInterval(sequentialRevealTimer);
          sequentialRevealTimer = null;
          return;
        }

        const seat = seats[currentSeatIndex];
        const vote = votes[seat.id];

        if (vote === "CHON") {
          seat.el.className = "seat is-green-lit";
          runningScore++;
          if (liveScoreCounter) liveScoreCounter.textContent = runningScore;
        } else {
          seat.el.className = "seat is-black";
        }

        currentSeatIndex++;
      }, 35); // 35ms mỗi ô -> ~3.5s hoàn thành 101 ô
    }

    // 2. Hiện kết quả (Đối đầu):
    // Đầu tiên chạy Hiệu ứng 4 (7s, lặp 1s/vòng).
    // Sau khi kết thúc 7s, những ô tương ứng sẽ có màu hồng hoặc màu xanh dương.
    // Hiển thị tỉ số ở trung tâm hàng 2 (font SFAlienEncountersSolid): Màu hồng bên trái, Màu xanh bên phải.
    function showVersusResult(votes = {}, pinkScore = 0, blueScore = 0, explicitServerStartTime = null) {
      if (referenceSwapInterval) {
        clearInterval(referenceSwapInterval);
        referenceSwapInterval = null;
      }
      const startTimestamp = explicitServerStartTime || getServerNow();
      const currentElapsed = Math.max(0, (getServerNow() - startTimestamp) / 1000);
      playAudio(4, currentElapsed);
      runHorizontalScanEffect(4, 7, 1.0, startTimestamp, () => {
        // Sau khi kết thúc 7 giây -> Hiển thị màu ghế và tỉ số
        seats.forEach(s => {
          const vote = votes[s.id];
          if (vote === "HONG") {
            s.el.className = "seat is-pink-lit";
          } else if (vote === "XANH") {
            s.el.className = "seat is-blue-lit";
          } else {
            s.el.className = "seat is-black";
          }
        });

        centerStageScore.style.display = "flex";
        centerStageScore.innerHTML = `
          <div class="score-pair">
            <span class="score-pink">${pinkScore}</span>
            <span class="score-blue">${blueScore}</span>
          </div>
        `;
      });
    }

    // 3. Hiện tỉ số tham khảo:
    // Đặt ở vị trí trung tâm (Màu hồng bên trái, Màu xanh bên phải).
    // Cứ 1 giây thì 2 con số sẽ đổi chỗ cho nhau (giữ nguyên màu sắc cố định: trái là Hồng, phải là Xanh).
    function showReferenceScore(scoreA = 50, scoreB = 51) {
      if (referenceSwapInterval) clearInterval(referenceSwapInterval);

      centerStageScore.style.display = "flex";
      let isSwapped = false;
      let valLeft = scoreA;
      let valRight = scoreB;

      function renderScores() {
        centerStageScore.innerHTML = `
          <div class="score-pair">
            <span class="score-pink">${isSwapped ? valRight : valLeft}</span>
            <span class="score-blue">${isSwapped ? valLeft : valRight}</span>
          </div>
        `;
      }

      renderScores();

      referenceSwapInterval = setInterval(() => {
        isSwapped = !isSwapped;
        renderScores();
      }, 1000);
    }

    // 4. Hiện tỉ số khán giả:
    // Đặt ở trung tâm: Màu hồng bên trái, Màu xanh bên phải (Font SFAlienEncountersSolid).
    function showAudienceScore(pink = 0, blue = 0) {
      if (referenceSwapInterval) clearInterval(referenceSwapInterval);

      centerStageScore.style.display = "flex";
      centerStageScore.innerHTML = `
        <div class="score-pair">
          <span class="score-pink">${pink}</span>
          <span class="score-blue">${blue}</span>
        </div>
      `;
    }

    // 5. Hiện sự bình chọn của các giám khảo bất kỳ theo danh sách vị trí đã chọn
    // LƯU Ý: Không tắt tính năng đổi chỗ 2 con số ở tỉ số tham khảo nếu chưa hiện kết quả đối đầu!
    // VÀ khi đổi vị trí hiện, các vị trí cũ KHÔNG tắt đèn (chỉ tắt khi reset).
    let revealedSpecificJudges = new Set();

    function showSpecificJudges(judgeIds = [], votes = {}) {
      if (currentAnimationId) {
        cancelAnimationFrame(currentAnimationId);
        currentAnimationId = null;
      }
      if (sequentialRevealTimer) {
        clearInterval(sequentialRevealTimer);
        sequentialRevealTimer = null;
      }

      // Thêm các ID mới vào tập hợp các ghế đã được mở
      judgeIds.forEach(id => {
        const num = Number(id);
        if (!isNaN(num) && num >= 1 && num <= 101) {
          revealedSpecificJudges.add(num);
        }
      });

      seats.forEach(s => {
        if (revealedSpecificJudges.has(s.id)) {
          const vote = votes[s.id];
          if (vote === "CHON") {
            s.el.className = "seat is-green-lit";
          } else if (vote === "HONG") {
            s.el.className = "seat is-pink-lit";
          } else if (vote === "XANH") {
            s.el.className = "seat is-blue-lit";
          } else if (vote === "KHONG_CHON") {
            s.el.className = "seat is-black";
          } else {
            s.el.className = "seat is-black";
          }
        } else {
          s.el.className = "seat is-black";
        }
      });
    }

    // Các hàm Reset điểm & Tỉ số trên sân khấu: Đưa 101 ô trở về màu trắng và xóa điểm
    function resetStageScore() {
      if (currentAnimationId) {
        cancelAnimationFrame(currentAnimationId);
        currentAnimationId = null;
      }
      if (sequentialRevealTimer) {
        clearInterval(sequentialRevealTimer);
        sequentialRevealTimer = null;
      }
      if (referenceSwapInterval) {
        clearInterval(referenceSwapInterval);
        referenceSwapInterval = null;
      }
      revealedSpecificJudges.clear();
      resetAllSeats("white");
      centerStageScore.style.display = "none";
      centerStageScore.innerHTML = "";
    }

    function resetReferenceScore() {
      if (currentAnimationId) {
        cancelAnimationFrame(currentAnimationId);
        currentAnimationId = null;
      }
      if (sequentialRevealTimer) {
        clearInterval(sequentialRevealTimer);
        sequentialRevealTimer = null;
      }
      if (referenceSwapInterval) {
        clearInterval(referenceSwapInterval);
        referenceSwapInterval = null;
      }
      revealedSpecificJudges.clear();
      resetAllSeats("white");
      centerStageScore.style.display = "none";
      centerStageScore.innerHTML = "";
    }

    function resetAudienceScore() {
      if (referenceSwapInterval) {
        clearInterval(referenceSwapInterval);
        referenceSwapInterval = null;
      }
      resetAllSeats("white");
      centerStageScore.style.display = "none";
      centerStageScore.innerHTML = "";
    }

    // Bộ kích hoạt hiệu ứng đồng bộ tuyệt đối
    function triggerEffect(effectNum, explicitServerStartTime = null) {
      console.log(`[Stage] Đồng bộ Hiệu ứng: ${effectNum} (ServerTime: ${explicitServerStartTime || getServerNow()})`);
      const startTimestamp = explicitServerStartTime || getServerNow();
      const currentElapsed = Math.max(0, (getServerNow() - startTimestamp) / 1000);
      playAudio(effectNum, currentElapsed);

      if (effectNum === 1) {
        runDiagonalSpreadEffect(1, 26, explicitServerStartTime);
      } else if (effectNum === 2) {
        runDiagonalSpreadEffect(2, 40, explicitServerStartTime);
      } else if (effectNum === 3) {
        runHorizontalScanEffect(3, 13, 1.0, explicitServerStartTime);
      } else if (effectNum === 4) {
        runHorizontalScanEffect(4, 7, 1.0, explicitServerStartTime);
      }
    }

    function stopEffect() {
      stopAllAudio();
      resetAllSeats("white");
    }

    // --- ĐỒNG BỘ WEBSOCKET + NTP CLOCK SYNC + BROADCASTCHANNEL ---
    let bc = null;
    if (hasRoomId) {
      bc = new BroadcastChannel(`stage101_channel_${currentRoomId}`);
      bc.onmessage = (e) => {
        const data = e.data;
        if (!data) return;
        if (data.type === "TRIGGER_EFFECT") {
          triggerEffect(Number(data.effect), data.serverStartTime);
        } else if (data.type === "STOP_EFFECT" || data.type === "RESET") {
          stopEffect();
        } else if (data.type === "SHOW_NORMAL_RESULT") {
          showNormalResult(data.votes);
        } else if (data.type === "SHOW_VERSUS_RESULT") {
          showVersusResult(data.votes, data.pinkScore, data.blueScore, data.serverStartTime);
        } else if (data.type === "SHOW_REFERENCE_SCORE") {
          showReferenceScore(data.scoreA, data.scoreB);
        } else if (data.type === "SHOW_AUDIENCE_SCORE") {
          showAudienceScore(data.pink, data.blue);
        } else if (data.type === "SHOW_SPECIFIC_JUDGES") {
          showSpecificJudges(data.judgeIds, data.votes);
        } else if (data.type === "RESET_SCORE") {
          resetStageScore();
        } else if (data.type === "RESET_REFERENCE_SCORE") {
          resetReferenceScore();
        } else if (data.type === "RESET_AUDIENCE_SCORE") {
          resetAudienceScore();
        } else if (data.type === "CLEAR_STAGE_DISPLAY") {
          resetAllSeats("white");
        }
      };
    }

    let ws = null;
    let clockSyncTimer = null;
    let fallbackPollTimer = null;

    function connectWebSocket() {
      if (!hasRoomId) return;
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${location.host}/ws?roomid=${encodeURIComponent(currentRoomId)}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log(`[WS] Đã kết nối Server NodeJS (Phòng: ${currentRoomId})`);
        ws.send(JSON.stringify({ type: "JOIN_ROOM", roomId: currentRoomId }));
        syncServerClock(ws);

        if (clockSyncTimer) clearInterval(clockSyncTimer);
        clockSyncTimer = setInterval(() => syncServerClock(ws), 10000);

        if (fallbackPollTimer) {
          clearInterval(fallbackPollTimer);
          fallbackPollTimer = null;
        }
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === "TIME_SYNC_RESPONSE") {
            const now = Date.now();
            const rtt = now - msg.clientPingTime;
            lastPingLatency = Math.round(rtt / 2);
            serverTimeOffset = msg.serverTime - (msg.clientPingTime + lastPingLatency);
            return;
          }

          if (msg.clientsCount !== undefined) {
            onlineClientsCount = msg.clientsCount;
          }

          if (msg.type === "EFFECT_TRIGGERED" && msg.state) {
            triggerEffect(Number(msg.state.effect), msg.state.serverStartTime);
          } else if (msg.type === "EFFECT_STOPPED" || msg.type === "RESET") {
            stopEffect();
          } else if (msg.type === "SHOW_NORMAL_RESULT" && msg.payload) {
            showNormalResult(msg.payload.votes);
          } else if (msg.type === "SHOW_VERSUS_RESULT" && msg.payload) {
            showVersusResult(msg.payload.votes, msg.payload.pinkScore, msg.payload.blueScore, msg.payload.serverStartTime);
          } else if (msg.type === "SHOW_REFERENCE_SCORE" && msg.payload) {
            showReferenceScore(msg.payload.scoreA, msg.payload.scoreB);
          } else if (msg.type === "SHOW_AUDIENCE_SCORE" && msg.payload) {
            showAudienceScore(msg.payload.pink, msg.payload.blue);
          } else if (msg.type === "SHOW_SPECIFIC_JUDGES" && msg.payload) {
            showSpecificJudges(msg.payload.judgeIds, msg.payload.votes);
          } else if (msg.type === "RESET_SCORE") {
            resetStageScore();
          } else if (msg.type === "RESET_REFERENCE_SCORE") {
            resetReferenceScore();
          } else if (msg.type === "RESET_AUDIENCE_SCORE") {
            resetAudienceScore();
          } else if (msg.type === "CLEAR_STAGE_DISPLAY") {
            resetAllSeats("white");
          } else if (msg.type === "STATE_SYNC" && msg.state) {
            if (msg.state.action === "start") {
              const currentElapsed = (getServerNow() - msg.state.serverStartTime) / 1000;
              if (currentElapsed < msg.state.duration) {
                triggerEffect(Number(msg.state.effect), msg.state.serverStartTime);
              }
            } else if (msg.state.stageDisplay && msg.state.stageDisplay.type !== "IDLE") {
              const sd = msg.state.stageDisplay;
              if (sd.type === "NORMAL_RESULT") showNormalResult(sd.votes);
              else if (sd.type === "VERSUS_RESULT") showVersusResult(sd.votes, sd.pinkScore, sd.blueScore, sd.serverStartTime);
              else if (sd.type === "REFERENCE_SCORE") showReferenceScore(sd.scoreA, sd.scoreB);
              else if (sd.type === "AUDIENCE_SCORE") showAudienceScore(sd.pink, sd.blue);
              else if (sd.type === "SPECIFIC_JUDGES") showSpecificJudges(sd.judgeIds, sd.votes);
            }
          }
        } catch (err) {
          console.error("Lỗi parse WS:", err);
        }
      };

      ws.onclose = () => {
        if (!fallbackPollTimer) {
          fallbackPollTimer = setInterval(pollServerState, 1500);
        }
        setTimeout(connectWebSocket, 2500);
      };

      ws.onerror = () => {
      };
    }

    async function pollServerState() {
      try {
        const res = await fetch(`/api/state?roomid=${encodeURIComponent(currentRoomId)}`);
        if (res.ok) {
          const data = await res.json();
          if (data.serverTime) {
            serverTimeOffset = data.serverTime - Date.now();
          }
          if (data.state) {
            if (data.state.action === "start") {
              const elapsed = (getServerNow() - data.state.serverStartTime) / 1000;
              if (elapsed < data.state.duration && currentEffectState.effect !== data.state.effect) {
                triggerEffect(Number(data.state.effect), data.state.serverStartTime);
              }
            } else if ((data.state.action === "stop" || data.state.action === "reset") && currentEffectState.effect !== null) {
              stopEffect();
            }
          }
        }
      } catch (e) {}
    }

    // Tự động căn chỉnh và scale toàn bộ sân khấu (1920x1080) vừa vặn với kích thước cửa sổ mặc định
    function autoScaleStage() {
      const container = document.querySelector('.scene-container');
      if (!container) return;
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      container.style.transform = `scale(${scale})`;
    }

    window.addEventListener("resize", autoScaleStage);
    window.addEventListener("orientationchange", autoScaleStage);
    autoScaleStage();

    connectWebSocket();
    resetAllSeats("white");
  </script>
</body>
</html>
